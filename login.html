<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page="page.login">THE HARPER 앱 미리보기 — 로그인</title>
  <meta name="description" content="THE HARPER 로그인·회원가입 화면: 카카오 · LINE · WeChat 계정으로 시작한다">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Tinos&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css?v=42">
  <link rel="stylesheet" href="onboarding.css?v=2">
  <link rel="stylesheet" href="login.css?v=2">
</head>
<body>
  <!-- 로그인·회원가입: SNS 버튼(카카오 · LINE · WeChat) → 처음이면 가입 마무리(닉네임 · 약관) → 돌아갈 화면(?from=, 기본 my.html).
       미리보기라 실제 SNS 서버에 연결하지 않고, 누르면 잠깐 연결 화면을 보여 준 뒤 가입·로그인 상태를 이 기기에 저장한다(auth.js) -->
  <main class="start" id="start">

    <!-- ① SNS 고르기 -->
    <section class="onb login" id="login" aria-labelledby="login-title">
      <div class="onb__header">
        <a class="onb__close" id="login-close" href="my.html" aria-label="닫기" data-i18n-attrs="aria-label=close"><img src="assets/close.svg" width="24" height="24" alt=""></a>
      </div>
      <div class="onb__body login__body">
        <div class="login__brand" aria-hidden="true">
          <p class="login__logo">THE HARPER</p>
          <p class="login__tagline">K-FASHION CURATION</p>
        </div>
        <div class="onb__head">
          <h1 class="onb__title" id="login-title" data-i18n="login.title">SNS 계정으로 시작하세요</h1>
          <p class="onb__sub" data-i18n="login.sub">처음이면 가입, 이미 가입했으면 바로 로그인돼요</p>
        </div>
        <div class="login__list">
          <button type="button" class="sns sns--kakao" data-provider="kakao">
            <img class="sns__icon" src="assets/sns/kakao.svg" width="24" height="24" alt="">
            <span data-i18n="login.kakao">카카오로 시작하기</span>
          </button>
          <button type="button" class="sns sns--line" data-provider="line">
            <img class="sns__icon" src="assets/sns/line.svg" width="24" height="24" alt="">
            <span data-i18n="login.line">LINE으로 시작하기</span>
          </button>
          <button type="button" class="sns sns--wechat" data-provider="wechat">
            <img class="sns__icon" src="assets/sns/wechat.svg" width="24" height="24" alt="">
            <span data-i18n="login.wechat">WeChat으로 시작하기</span>
          </button>
        </div>
        <p class="login__terms" data-i18n="login.terms">계속하면 이용약관과 개인정보 처리방침에 동의한 것으로 봅니다.</p>
      </div>
    </section>

    <!-- ② 연결 중(잠깐) -->
    <section class="onb connecting" id="connecting" aria-live="polite" hidden>
      <div class="onb__header"></div>
      <div class="onb__body connecting__body">
        <span class="connecting__spinner" aria-hidden="true"></span>
        <p class="connecting__text" id="connecting-text"></p>
      </div>
    </section>

    <!-- ③ 가입 마무리: 닉네임 · 약관 -->
    <section class="onb signup" id="signup" aria-labelledby="signup-title" hidden>
      <div class="onb__header onb__header--back">
        <button type="button" class="onb__close" id="signup-back" aria-label="뒤로" data-i18n-attrs="aria-label=back"><img src="assets/chevron-left.svg" width="24" height="24" alt=""></button>
      </div>
      <div class="onb__body">
        <div class="onb__head">
          <h1 class="onb__title" id="signup-title" data-i18n="signup.title">회원가입</h1>
          <p class="onb__sub" id="signup-sub"></p>
        </div>
        <div class="field">
          <label class="field__label" for="signup-name" data-i18n="signup.nickname">닉네임</label>
          <input class="field__input" id="signup-name" type="text" maxlength="20" autocomplete="nickname" autocapitalize="off">
          <p class="field__hint" data-i18n="signup.nicknameHint">매장 리뷰에 보이는 이름이에요</p>
        </div>
        <div class="onb__list agree" role="group" aria-label="약관 동의">
          <button type="button" class="onb__item agree__all" role="checkbox" aria-checked="false" data-agree="all">
            <span data-i18n="signup.all">모두 동의</span><img src="assets/check-circle.svg" alt="">
          </button>
          <button type="button" class="onb__item agree__item" role="checkbox" aria-checked="false" data-agree="terms" data-required>
            <span><em class="agree__tag" data-i18n="signup.required">필수</em><span data-i18n="signup.terms">이용약관 동의</span></span><img src="assets/check-circle.svg" alt="">
          </button>
          <button type="button" class="onb__item agree__item" role="checkbox" aria-checked="false" data-agree="privacy" data-required>
            <span><em class="agree__tag" data-i18n="signup.required">필수</em><span data-i18n="signup.privacy">개인정보 수집·이용 동의</span></span><img src="assets/check-circle.svg" alt="">
          </button>
          <button type="button" class="onb__item agree__item" role="checkbox" aria-checked="false" data-agree="marketing">
            <span><em class="agree__tag agree__tag--opt" data-i18n="signup.optional">선택</em><span data-i18n="signup.marketing">새 에디터 픽·투어 소식 받기</span></span><img src="assets/check-circle.svg" alt="">
          </button>
        </div>
      </div>
      <button type="button" class="onb__cta" id="signup-done" data-i18n="signup.done" disabled>가입 완료</button>
    </section>

  </main>

  <script src="i18n.js?v=3"></script>
  <script src="auth.js?v=1"></script>
  <script src="login.js?v=1"></script>
</body>
</html>
