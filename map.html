<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HARPER 앱 미리보기 — 지도</title>
  <meta name="description" content="THE HARPER 모바일앱 검색(지도) 화면을 웹에서 미리 보는 페이지. 피그마 시안이 아직 없어 임의로 구성한 화면">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <main class="phone phone--explore phone--map" aria-label="THE HARPER 지도">

    <header class="header">
      <p class="header__logo">THE HARPER</p>
      <a class="header__icon" href="search.html" aria-label="검색">
        <img src="assets/search.svg" width="24" height="24" alt="">
      </a>
    </header>

    <div class="explore explore--map">
      <nav class="explore__tabs" aria-label="보기 방식">
        <a class="explore__tab" href="search.html">매장 목록</a>
        <a class="explore__tab" href="map.html" aria-current="page">지도</a>
      </nav>

      <!-- 지도: 시안이 없어 임의로 그린 성수동 골목 느낌의 자리표시 지도 -->
      <div class="map" role="img" aria-label="성수동 매장 위치 지도(임시)">
        <svg class="map__streets" viewBox="0 0 440 520" preserveAspectRatio="none" aria-hidden="true">
          <g class="map__block">
            <rect x="24" y="36" width="150" height="110" rx="10"/>
            <rect x="202" y="36" width="214" height="70" rx="10"/>
            <rect x="202" y="134" width="96" height="100" rx="10"/>
            <rect x="326" y="134" width="90" height="156" rx="10"/>
            <rect x="24" y="174" width="150" height="116" rx="10"/>
            <rect x="202" y="262" width="96" height="124" rx="10"/>
            <rect x="24" y="318" width="150" height="90" rx="10"/>
            <rect x="326" y="318" width="90" height="168" rx="10"/>
            <rect x="24" y="436" width="274" height="50" rx="10"/>
            <rect x="202" y="414" width="96" height="0" rx="10"/>
          </g>
          <g class="map__road">
            <path d="M188 0V520"/>
            <path d="M312 120V520"/>
            <path d="M0 160H440"/>
            <path d="M0 304H440"/>
            <path d="M0 422H312"/>
          </g>
          <g class="map__road map__road--thin">
            <path d="M24 112H174"/>
            <path d="M202 120H440"/>
            <path d="M202 248H298"/>
            <path d="M24 400H174"/>
          </g>
        </svg>

        <button type="button" class="map__pin map__pin--active" style="left: 96px; top: 206px;">
          <span class="map__pin-icon" aria-hidden="true"></span>
          <span class="map__pin-label">썬러브 링크스 성수</span>
        </button>
        <button type="button" class="map__pin" style="left: 250px; top: 94px;">
          <span class="map__pin-icon" aria-hidden="true"></span>
          <span class="map__pin-label">아뜰리에 K</span>
        </button>
        <button type="button" class="map__pin" style="left: 358px; top: 364px;">
          <span class="map__pin-icon" aria-hidden="true"></span>
          <span class="map__pin-label">스튜디오 성수</span>
        </button>

        <p class="map__hint">임시 지도 · 실제 지도로 교체 예정</p>
      </div>

      <!-- 지도 아래 매장 카드: 가로로 넘겨 보기 -->
      <div class="map__cards">
        <article class="shop-row shop-row--card">
          <div class="shop-row__thumb">
            <img class="photo__img" src="assets/photo.png" alt="">
            <div class="photo__shade" aria-hidden="true"></div>
            <span class="badge">PICK</span>
          </div>
          <div class="shop-row__body">
            <div class="shop-row__text">
              <h2 class="shop-row__name">썬러브 링크스 성수</h2>
              <p class="shop-row__addr">성수동2가 269-77</p>
            </div>
            <p class="shop-row__note"><img src="assets/check-circle.svg" width="16" height="16" alt=""><span>성수 숨은 디자이너 브랜드 편집샵</span></p>
          </div>
        </article>
        <article class="shop-row shop-row--card">
          <div class="shop-row__thumb">
            <img class="photo__img" src="assets/photo.png" alt="">
            <div class="photo__shade" aria-hidden="true"></div>
            <span class="badge">PICK</span>
          </div>
          <div class="shop-row__body">
            <div class="shop-row__text">
              <h2 class="shop-row__name">아뜰리에 K</h2>
              <p class="shop-row__addr">성수동2가 [확인 필요]</p>
            </div>
            <p class="shop-row__note"><img src="assets/check-circle.svg" width="16" height="16" alt=""><span>에디터 한줄 코멘트 [확인 필요]</span></p>
          </div>
        </article>
        <article class="shop-row shop-row--card">
          <div class="shop-row__thumb">
            <img class="photo__img" src="assets/photo.png" alt="">
            <div class="photo__shade" aria-hidden="true"></div>
            <span class="badge">PICK</span>
          </div>
          <div class="shop-row__body">
            <div class="shop-row__text">
              <h2 class="shop-row__name">스튜디오 성수</h2>
              <p class="shop-row__addr">성수동1가 [확인 필요]</p>
            </div>
            <p class="shop-row__note"><img src="assets/check-circle.svg" width="16" height="16" alt=""><span>에디터 한줄 코멘트 [확인 필요]</span></p>
          </div>
        </article>
      </div>
    </div>

    <!-- 하단 탭 (아이콘: Solar Bold) -->
    <nav class="tabbar" aria-label="주요 메뉴">
      <a class="tab" href="index.html">
        <span class="tab__icon tab__icon--home" aria-hidden="true"></span>
        <span class="tab__label">홈</span>
      </a>
      <a class="tab" href="search.html" aria-current="page">
        <span class="tab__icon tab__icon--search" aria-hidden="true"></span>
        <span class="tab__label">검색</span>
      </a>
      <a class="tab" href="#" aria-disabled="true">
        <span class="tab__icon tab__icon--user" aria-hidden="true"></span>
        <span class="tab__label">내 정보</span>
      </a>
    </nav>
  </main>
</body>
</html>
