<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page="page.shop">THE HARPER 앱 미리보기 — 매장 상세</title>
  <meta name="description" content="THE HARPER 모바일앱 매장(브랜드) 상세 화면을 웹에서 미리 보는 페이지. 설계서 08 매장 상세 구조(사진 캐러셀 · 브랜드명 · 에디터 노트 · 매장 정보 · 탭 · 리뷰 · 하단 버튼)로 구성">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans:wght@400..800&family=Noto+Sans+KR:wght@400..800&family=Noto+Sans+JP:wght@400..800&family=Noto+Sans+SC:wght@400..800&family=Noto+Sans+TC:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" integrity="sha512-h9FcoyWjHcOcmEVkxOfTLnmZFWIH0iZhZT1H2TbOq55xssQGEJHEaIm+PgoUaZbRvQTNTluNOEfb1ZRy6D3BOw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=47">
  <link rel="stylesheet" href="magazine.css?v=10">
  <link rel="stylesheet" href="shop.css?v=11">
</head>
<body class="body--magazine">
  <main class="phone phone--magazine phone--shop" aria-label="THE HARPER 매장 상세">

    <header class="mag-header">
      <a class="mag-header__back" href="search.html" aria-label="뒤로" data-i18n-attrs="aria-label=back">
        <img src="assets/chevron-left.svg" width="24" height="24" alt="">
      </a>
      <div class="mag-header__tools">
        <button type="button" class="mag-header__like" id="shop-like-top" aria-pressed="false" aria-label="찜하기" data-i18n-attrs="aria-label=like">
          <span class="heart-icon" aria-hidden="true"></span>
        </button>
        <button type="button" class="mag-header__share" aria-label="공유" data-i18n-attrs="aria-label=share">
          <img src="assets/share.svg" width="24" height="24" alt="">
        </button>
      </div>
    </header>

    <!-- ① 사진 캐러셀: 옆으로 밀어 넘기고, 오른쪽 위에 몇 번째 사진인지 표시 -->
    <section class="gallery" aria-label="매장 사진" data-i18n-attrs="aria-label=gallery.aria">
      <div class="gallery__track" id="gallery-track"></div>
      <span class="gallery__count" id="gallery-count">1/1</span>
      <div class="dots gallery__dots" id="gallery-dots" aria-hidden="true"></div>
      <!-- 좌우 화살표: 홈 투어 카드의 화살표 버튼을 동그랗게. 사진이 2장 이상일 때만 보인다 -->
      <button type="button" class="gallery__arrow" data-dir="-1" aria-label="이전 사진" data-i18n-attrs="aria-label=gallery.prev" hidden>
        <img src="assets/chevron-left-20.svg" width="20" height="20" alt="">
      </button>
      <button type="button" class="gallery__arrow" data-dir="1" aria-label="다음 사진" data-i18n-attrs="aria-label=gallery.next" hidden>
        <img src="assets/chevron-right-20.svg" width="20" height="20" alt="">
      </button>
    </section>

    <article class="mag">

      <!-- ② 브랜드명 · 티어 배지 · 태그 -->
      <div class="mag__block">
        <div class="mag__title-group">
          <div class="shop__name-row">
            <h1 class="mag__title" id="shop-name" data-i18n="shop.name">매장명</h1>
            <span class="badge badge--pick" id="shop-badge">PICK</span>
          </div>
          <p class="shop__addr" id="shop-addr"></p>
        </div>
        <div class="shop__chips" id="shop-tags"></div>
      </div>

      <!-- ③ 에디터 큐레이션 노트 -->
      <div class="mag__block">
        <div class="mag__quote shop__note">
          <img class="mag__quote-icon" src="assets/annotation.svg" width="20" height="20" alt="">
          <p class="mag__summary" id="shop-note"></p>
          <div class="editor editor--ink" data-editor="h">
            <span class="editor__avatar" aria-hidden="true"></span>
            <span class="editor__name">에디터H</span>
          </div>
        </div>

        <!-- ④ 매장 정보 -->
        <dl class="mag__info">
          <div class="mag__info-labels">
            <dt data-i18n="info.addr">주소</dt>
            <dt data-i18n="info.hours">영업시간</dt>
            <dt data-i18n="info.closed">휴무</dt>
            <dt data-i18n="info.phone">전화</dt>
          </div>
          <div class="mag__info-values">
            <dd id="shop-info-addr"></dd>
            <dd id="shop-info-hours" data-i18n="tbd">[확인 필요]</dd>
            <dd id="shop-info-closed" data-i18n="tbd">[확인 필요]</dd>
            <dd id="shop-info-phone" data-i18n="tbd">[확인 필요]</dd>
          </div>
        </dl>
      </div>
    </article>

    <!-- ⑤ 탭: 스크롤해도 위에 붙어 있고, 누르면 그 부분으로 내려간다 -->
    <nav class="shop-tabs" id="shop-tabs" aria-label="상세 구분" data-i18n-attrs="aria-label=shop.tabsAria">
      <a class="shop-tabs__tab" href="#sec-intro" aria-current="true" data-i18n="shop.tab.intro">소개</a>
      <a class="shop-tabs__tab" href="#sec-drops" data-i18n="shop.tab.drops">상품·드롭</a>
      <a class="shop-tabs__tab" href="#sec-reviews" data-i18n="shop.tab.reviews">리뷰</a>
    </nav>

    <article class="mag mag--sections">
      <section class="shop-section" id="sec-intro" aria-labelledby="sec-intro-title">
        <h2 class="shop-section__title" id="sec-intro-title" data-i18n="shop.tab.intro">소개</h2>
        <div class="mag__body" id="shop-intro"></div>

        <!-- 위치: 16:9 미니 지도(누르면 지도 화면) + 주소. 좌표가 없으면 지도 칸을 숨기고 주소만 -->
        <div class="shop-map" id="shop-map-block">
          <h3 class="shop-map__title" data-i18n="shop.location">위치</h3>
          <div class="shop-map__frame" id="shop-map-frame">
            <div class="shop-map__canvas" id="shop-map" aria-hidden="true"></div>
            <a class="shop-map__link" id="shop-map-link" href="map.html" aria-label="지도 화면에서 이 매장 위치 보기" data-i18n-attrs="aria-label=shop.mapLink"></a>
          </div>
          <p class="shop-map__addr" id="shop-map-addr"></p>
        </div>
      </section>

      <section class="shop-section" id="sec-drops" aria-labelledby="sec-drops-title">
        <h2 class="shop-section__title" id="sec-drops-title" data-i18n="shop.tab.drops">상품·드롭</h2>
        <p class="shop-section__lead" data-i18n="shop.dropsLead">이 매장이 들어 있는 투어예요. 상품은 매장에서 직접 사고, 투어는 여기서 예약합니다.</p>
        <div class="shop-list" id="shop-drops"></div>
      </section>

      <!-- ⑥ 방문자 리뷰 피드: 아직 리뷰가 없을 때 -->
      <section class="shop-section" id="sec-reviews" aria-labelledby="sec-reviews-title">
        <h2 class="shop-section__title" id="sec-reviews-title" data-i18n="shop.tab.reviews">리뷰</h2>
        <div class="review-empty">
          <p class="review-empty__text" data-i18n-html="shop.reviewsEmpty">아직 방문 후기가 없어요.<br>다녀오셨다면 첫 후기를 남겨 주세요.</p>
          <button type="button" class="review-empty__btn" data-i18n="shop.reviewWrite">리뷰 쓰기</button>
        </div>
      </section>
    </article>

    <!-- ⑦ 찜하기 · 예약하기 -->
    <div class="cta-bar">
      <a class="cta-bar__main" href="magazine.html" id="shop-book">
        <span class="cta-bar__main-label" data-i18n="shop.book">예약하기</span>
        <span class="cta-bar__main-price"><span data-i18n="shop.bookPrice">128,000원~</span> <small data-i18n="shop.bookPer">4인 기준</small></span>
      </a>
    </div>

  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" integrity="sha512-puJW3E/qXDqYp9IfhAI54BJEaWIfloJ7JWs7OeD5i6ruC9JZL1gERT1wjtwXFlh7CjE7ZJ+/vcRZRkIYIb6p4g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.1.3/leaflet-maplibre-gl.js"></script>
  <script src="i18n.js?v=7"></script>
  <script src="map-style.js?v=1"></script>
  <script src="config.js?v=2"></script>
  <script src="home.js?v=17"></script>
  <script src="shops.js?v=8"></script>
  <script src="shop.js?v=15"></script>
</body>
</html>
