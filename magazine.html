<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page="page.magazine">THE HARPER 앱 미리보기 — 매거진</title>
  <meta name="description" content="THE HARPER 모바일앱 매거진 상세 화면을 웹에서 미리 보는 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css?v=42">
  <link rel="stylesheet" href="magazine.css?v=12">
</head>
<body class="body--magazine">
  <main class="phone phone--magazine" aria-label="THE HARPER 매거진 상세">

    <header class="mag-header">
      <a class="mag-header__back" href="index.html" aria-label="뒤로" data-i18n-attrs="aria-label=back">
        <img src="assets/chevron-left.svg" width="24" height="24" alt="">
      </a>
      <button type="button" class="mag-header__share" aria-label="공유" data-i18n-attrs="aria-label=share">
        <img src="assets/share.svg" width="24" height="24" alt="">
      </button>
    </header>

    <!-- 글은 Supabase magazines 표(없으면 data/magazines.json)에서 magazine.js 가 채운다. ?id=<slug> -->
    <div class="photo photo--mag">
      <img class="photo__img" id="mag-hero" src="" alt="">
      <span class="mag-badge" id="mag-badge"></span>
    </div>

    <article class="mag">

      <!-- 제목 · 에디터 · 가격 -->
      <div class="mag__block">
        <div class="mag__title-group">
          <h1 class="mag__title" id="mag-title"></h1>
          <div class="mag__byline">
            <div class="editor editor--ink" id="mag-editor" data-editor="">
              <span class="editor__avatar" aria-hidden="true"></span>
              <span class="editor__name"></span>
            </div>
            <time class="mag__date" id="mag-date"></time>
          </div>
        </div>
        <div class="mag__price" id="mag-price" hidden>
          <p class="mag__price-value" id="mag-price-value"></p>
          <p class="price__note" id="mag-price-note"></p>
        </div>
      </div>

      <!-- 요약 · 안내 · 본문 · 브랜드 묶음 -->
      <div class="mag__block">
        <div class="mag__inner-group">
          <div class="mag__cards" id="mag-cards">
            <div class="mag__quote" id="mag-quote" hidden>
              <img class="mag__quote-icon" src="assets/annotation.svg" width="20" height="20" alt="">
              <p class="mag__summary" id="mag-summary"></p>
            </div>

            <dl class="mag__info" id="mag-info" hidden>
              <div class="mag__info-labels" id="mag-info-labels"></div>
              <div class="mag__info-values" id="mag-info-values"></div>
            </dl>
          </div>

          <div class="mag__body" id="mag-body"></div>

          <div class="mag__sections" id="mag-sections" hidden></div>
        </div>

        <!-- 관련 매장 -->
        <a class="mag__related" id="mag-related" href="#" hidden>
          <span class="mag__related-label" id="mag-related-label"></span>
          <img src="assets/chevron-right.svg" width="24" height="24" alt="">
        </a>
      </div>

    </article>

    <!-- 하단 고정 버튼 -->
    <div class="mag__cta-bar">
      <a class="mag__cta" id="mag-cta" href="#" aria-disabled="true"></a>
    </div>

  </main>
  <script src="i18n.js?v=2"></script>
  <script src="config.js?v=2"></script>
  <script src="home.js?v=15"></script>
  <script src="magazine.js?v=6"></script>
</body>
</html>
