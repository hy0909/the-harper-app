<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page="settings.lang">THE HARPER 앱 미리보기 — 언어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans:wght@400..800&family=Noto+Sans+KR:wght@400..800&family=Noto+Sans+JP:wght@400..800&family=Noto+Sans+SC:wght@400..800&family=Noto+Sans+TC:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=50">
  <link rel="stylesheet" href="magazine.css?v=12">
  <link rel="stylesheet" href="my.css?v=8">
</head>
<body>
  <main class="phone phone--sub" aria-label="THE HARPER 언어 설정">

    <!-- 상단 바: 매장 상세와 같은 mag-header(48px). 제목은 바 가운데에 절대 위치로 둔다 -->
    <header class="mag-header sub-head">
      <a class="mag-header__back sub-back" href="my.html" aria-label="뒤로" data-i18n-attrs="aria-label=back">
        <img src="assets/chevron-left.svg" width="24" height="24" alt="">
      </a>
      <h1 class="sub-head__title" data-i18n="settings.lang">언어</h1>
    </header>

    <div class="content content--sub">
      <!-- 언어 5개. 고르면 harper:lang 에 저장하고 이 화면 글을 바로 그 언어로 바꾼다(체크 표시도 옮김) -->
      <ul class="my-card my-list" id="lang-list">
        <li><button type="button" class="drawer__item" aria-selected="false" data-lang="ko">한국어</button></li>
        <li><button type="button" class="drawer__item" aria-selected="false" data-lang="en">English</button></li>
        <li><button type="button" class="drawer__item" aria-selected="false" data-lang="ja">日本語</button></li>
        <li><button type="button" class="drawer__item" aria-selected="false" data-lang="zh-Hans">简体中文</button></li>
        <li><button type="button" class="drawer__item" aria-selected="false" data-lang="zh-Hant">繁體中文</button></li>
      </ul>
    </div>
  </main>

  <script src="i18n.js?v=10"></script>
  <script src="my-sub.js?v=1"></script>
</body>
</html>
