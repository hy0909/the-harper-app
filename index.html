<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    /* 처음 켜는 사람은 온보딩 페이지로 보낸다. 주소에 ?onboarding=1 이 있으면 다시 보여 준다.
       저장소를 못 읽는 환경(저장 차단 등)은 온보딩을 끝낸 것으로 보고 그냥 홈에 머문다. 아니면 두 페이지가 번갈아 돌아간다 */
    (function () {
      var force = /[?&]onboarding=1/.test(location.search);
      var done = '1';
      try { done = localStorage.getItem('harper:onboarded'); } catch (e) {}
      if (force || !done) location.replace('onboarding.html');
    })();
  </script>
  <title data-i18n-page="page.home">THE HARPER 앱 미리보기 — 홈</title>
  <meta name="description" content="THE HARPER 모바일앱 홈 화면을 웹에서 미리 보는 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans:wght@400..800&family=Noto+Sans+KR:wght@400..800&family=Noto+Sans+JP:wght@400..800&family=Noto+Sans+SC:wght@400..800&family=Noto+Sans+TC:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=47">
</head>
<body>
  <main class="phone" aria-label="THE HARPER 앱 홈">

    <header class="header">
      <a class="header__logo" href="index.html">THE HARPER</a>
      <a class="header__icon" href="search.html" aria-label="검색" data-i18n-attrs="aria-label=header.search">
        <img src="assets/search.svg" width="24" height="24" alt="">
      </a>
    </header>

    <div class="content">

      <!-- 오늘의 추천 (제목·사진·에디터는 home.js 가 매거진 글에서 가져온다) -->
      <section class="today" aria-labelledby="today-title" id="today-section">
        <div class="today__head">
          <p class="eyebrow" id="today-title"></p>
          <h1 class="today__headline"><a id="today-headline" href="magazine.html" tabindex="-1"></a></h1>
        </div>
        <a class="today__media" id="today-link" href="magazine.html">
          <div class="photo photo--hero" id="today-photo"></div>
          <div class="today__bar" id="today-editor"></div>
        </a>
      </section>

      <!-- 투어 종류 -->
      <section class="tours" aria-labelledby="tours-title">
        <div class="tours__head">
          <div class="tours__title">
            <p class="eyebrow" id="tours-title"></p>
            <button type="button" class="tours__info" id="tours-info" aria-label="투어 종류 안내 보기" data-i18n-attrs="aria-label=tours.infoBtn" aria-haspopup="dialog" aria-expanded="false">
              <img src="assets/info.svg" width="20" height="20" alt="">
            </button>
          </div>
          <div class="tours__nav">
            <button type="button" class="tours__arrow" data-dir="-1" aria-label="이전 투어" data-i18n-attrs="aria-label=tours.prev">
              <img src="assets/chevron-left-20.svg" width="20" height="20" alt="">
            </button>
            <button type="button" class="tours__arrow" data-dir="1" aria-label="다음 투어" data-i18n-attrs="aria-label=tours.next">
              <img src="assets/chevron-right-20.svg" width="20" height="20" alt="">
            </button>
          </div>
        </div>
        <div class="tours__carousel">
          <div class="tours__track" id="tours-track"></div>
          <div class="dots tours__dots" id="tours-dots" aria-hidden="true"></div>
        </div>
      </section>

      <!-- 에디터 큐레이션 피드 -->
      <section class="feed" aria-labelledby="feed-title">
        <p class="eyebrow feed__head" id="feed-title"></p>
        <div class="feed__list" id="feed-list"></div>
      </section>

      <!-- 에디터’s PICK -->
      <section class="picks" aria-labelledby="picks-title">
        <div class="picks__head">
          <p class="eyebrow" id="picks-title"></p>
          <div class="picks__nav">
            <button type="button" class="picks__arrow" data-dir="-1" aria-label="이전 추천" data-i18n-attrs="aria-label=picks.prev">
              <img src="assets/chevron-left-20.svg" width="20" height="20" alt="">
            </button>
            <button type="button" class="picks__arrow" data-dir="1" aria-label="다음 추천" data-i18n-attrs="aria-label=picks.next">
              <img src="assets/chevron-right-20.svg" width="20" height="20" alt="">
            </button>
          </div>
        </div>
        <div class="picks__scroll" id="picks-track"></div>
        <div class="dots picks__dots" id="picks-dots" aria-hidden="true"></div>
      </section>

    </div>

    <!-- 하단 탭 (아이콘: 홈 Material Symbols · 검색 Fluent Filled · 내 정보 IconaMoon Fill) -->
    <nav class="tabbar" aria-label="주요 메뉴" data-i18n-attrs="aria-label=nav.main">
      <a class="tab" href="index.html" aria-current="page">
        <span class="tab__icon tab__icon--home" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.home">홈</span>
      </a>
      <a class="tab" href="search.html">
        <span class="tab__icon tab__icon--search" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.search">매장 검색</span>
      </a>
      <a class="tab" href="my.html">
        <span class="tab__icon tab__icon--user" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.my">내 정보</span>
      </a>
    </nav>
  </main>

  <!-- 투어 종류 안내 (ⓘ 버튼으로 연다). 제목·설명·항목은 home.js 가 home.tours 값으로 채운다 -->
  <div class="tour-info" id="tour-info" hidden>
    <div class="tour-info__dim" aria-hidden="true"></div>
    <div class="tour-info__card" role="dialog" aria-modal="true" aria-labelledby="tour-info-title">
      <div class="tour-info__head">
        <h2 class="tour-info__title" id="tour-info-title"></h2>
        <button type="button" class="tour-info__close" aria-label="닫기" data-i18n-attrs="aria-label=close">
          <img src="assets/close.svg" width="24" height="24" alt="">
        </button>
      </div>
      <ul class="tour-info__list" id="tour-info-list"></ul>
      <a class="tour-info__cta" id="tour-info-cta" href="magazine.html" data-i18n="shop.book">예약하기</a>
    </div>
  </div>

  <script src="i18n.js?v=9"></script>
  <script src="config.js?v=2"></script>
  <script src="home.js?v=18"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
