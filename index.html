<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THE HARPER 앱 미리보기 — 홈</title>
  <meta name="description" content="THE HARPER 모바일앱 홈 화면을 웹에서 미리 보는 페이지">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Tinos&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="styles.css?v=34">
  <link rel="stylesheet" href="onboarding.css?v=1">
</head>
<body>
  <!-- 처음 켤 때만: 스플래시 → 언어 → 관심 스타일 (피그마 17:698 · 18:767 · 20:980). onboarding.js 가 보여 주고 숨긴다 -->
  <div class="start" id="start" hidden>
    <section class="splash" id="splash" aria-label="THE HARPER">
      <p class="splash__logo">THE HARPER</p>
      <p class="splash__tagline">K-FASHION CURATION</p>
    </section>

    <section class="onb" id="onb-lang" aria-labelledby="onb-lang-title" hidden>
      <div class="onb__header"></div>
      <div class="onb__body">
        <div class="onb__head"><h1 class="onb__title" id="onb-lang-title">언어를 선택하세요</h1></div>
        <div class="onb__list" role="radiogroup" aria-labelledby="onb-lang-title">
          <button type="button" class="onb__item" role="radio" aria-checked="true" data-value="ko"><span>한국어</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="radio" aria-checked="false" data-value="en"><span>English</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="radio" aria-checked="false" data-value="ja"><span>日本語</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="radio" aria-checked="false" data-value="zh-Hans"><span>简体中文</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="radio" aria-checked="false" data-value="zh-Hant"><span>繁體中文</span><img src="assets/check-circle.svg" alt=""></button>
        </div>
      </div>
      <button type="button" class="onb__cta">다음</button>
    </section>

    <section class="onb" id="onb-style" aria-labelledby="onb-style-title" hidden>
      <div class="onb__header"></div>
      <div class="onb__body">
        <div class="onb__head">
          <h1 class="onb__title" id="onb-style-title">관심 스타일을 선택하세요</h1>
          <p class="onb__sub">복수 선택 허용</p>
        </div>
        <div class="onb__list" role="group" aria-labelledby="onb-style-title">
          <button type="button" class="onb__item" role="checkbox" aria-checked="true" data-value="editorial"><span>에디토리얼</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="checkbox" aria-checked="false" data-value="minimal"><span>미니멀</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="checkbox" aria-checked="false" data-value="street"><span>스트리트</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="checkbox" aria-checked="false" data-value="vintage"><span>빈티지</span><img src="assets/check-circle.svg" alt=""></button>
          <button type="button" class="onb__item" role="checkbox" aria-checked="false" data-value="feminine"><span>페미닌</span><img src="assets/check-circle.svg" alt=""></button>
        </div>
      </div>
      <button type="button" class="onb__cta">시작하기</button>
    </section>
  </div>

  <main class="phone" aria-label="THE HARPER 앱 홈">

    <header class="header">
      <a class="header__logo" href="index.html">THE HARPER</a>
      <a class="header__icon" href="search.html" aria-label="검색">
        <img src="assets/search.svg" width="24" height="24" alt="">
      </a>
    </header>

    <div class="content">

      <!-- 오늘의 추천 (내용은 data/content.json → home.js 가 채운다) -->
      <section class="today" aria-labelledby="today-title" id="today-section">
        <div class="today__head">
          <p class="eyebrow" id="today-title"></p>
          <h1 class="today__headline" id="today-headline"></h1>
        </div>
        <div class="today__media">
          <div class="photo photo--hero" id="today-photo"></div>
          <div class="today__price-row">
            <div class="price">
              <p class="price__value" id="today-price"></p>
              <p class="price__note" id="today-note"></p>
            </div>
            <button type="button" class="button" id="today-cta"></button>
          </div>
        </div>
      </section>

      <!-- 투어 종류 -->
      <section class="tours" aria-labelledby="tours-title">
        <div class="tours__head">
          <p class="eyebrow" id="tours-title"></p>
          <div class="tours__nav">
            <button type="button" class="tours__arrow" data-dir="-1" aria-label="이전 투어">
              <img src="assets/chevron-left-20.svg" width="20" height="20" alt="">
            </button>
            <button type="button" class="tours__arrow" data-dir="1" aria-label="다음 투어">
              <img src="assets/chevron-right-20.svg" width="20" height="20" alt="">
            </button>
          </div>
        </div>
        <div class="tours__carousel">
          <div class="tours__track" id="tours-track"></div>
          <div class="dots tours__dots" id="tours-dots" aria-hidden="true"></div>
        </div>
      </section>

      <!-- 에디터 큐레이션 피드 -->
      <section class="feed" aria-labelledby="feed-title">
        <p class="eyebrow feed__head" id="feed-title"></p>
        <div class="feed__list" id="feed-list"></div>
      </section>

      <!-- 에디터’s PICK -->
      <section class="picks" aria-labelledby="picks-title">
        <div class="picks__head">
          <p class="eyebrow" id="picks-title"></p>
          <div class="picks__nav">
            <button type="button" class="picks__arrow" data-dir="-1" aria-label="이전 추천">
              <img src="assets/chevron-left-20.svg" width="20" height="20" alt="">
            </button>
            <button type="button" class="picks__arrow" data-dir="1" aria-label="다음 추천">
              <img src="assets/chevron-right-20.svg" width="20" height="20" alt="">
            </button>
          </div>
        </div>
        <div class="picks__scroll" id="picks-track"></div>
        <div class="dots picks__dots" id="picks-dots" aria-hidden="true"></div>
      </section>

    </div>

    <!-- 하단 탭 (아이콘: 홈 Material Symbols · 검색 Fluent Filled · 내 정보 IconaMoon Fill) -->
    <nav class="tabbar" aria-label="주요 메뉴">
      <a class="tab" href="index.html" aria-current="page">
        <span class="tab__icon tab__icon--home" aria-hidden="true"></span>
        <span class="tab__label">홈</span>
      </a>
      <a class="tab" href="search.html">
        <span class="tab__icon tab__icon--search" aria-hidden="true"></span>
        <span class="tab__label">매장 검색</span>
      </a>
      <a class="tab" href="my.html">
        <span class="tab__icon tab__icon--user" aria-hidden="true"></span>
        <span class="tab__label">내 정보</span>
      </a>
    </nav>
  </main>

  <script src="config.js?v=2"></script>
  <script src="home.js?v=5"></script>
  <script src="app.js?v=7"></script>
  <script src="onboarding.js?v=1"></script>
</body>
</html>
