<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page="page.my">THE HARPER 앱 미리보기 — 내 정보</title>
  <meta name="description" content="THE HARPER 모바일앱 내 정보(마이페이지) 화면을 웹에서 미리 보는 페이지. 설계서 09 구성(프로필 · 찜한 매장 · 방문 히스토리 · 언어/알림 설정 · 고객센터 · 로그아웃)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Noto+Sans:wght@400..800&family=Noto+Sans+KR:wght@400..800&family=Noto+Sans+JP:wght@400..800&family=Noto+Sans+SC:wght@400..800&family=Noto+Sans+TC:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=48">
  <link rel="stylesheet" href="my.css?v=9">
</head>
<body>
  <main class="phone phone--my" aria-label="THE HARPER 내 정보">

    <header class="header">
      <a class="header__logo" href="index.html">THE HARPER</a>
      <a class="header__icon" href="search.html" aria-label="검색" data-i18n-attrs="aria-label=header.search">
        <img src="assets/search.svg" width="24" height="24" alt="">
      </a>
    </header>

    <div class="content content--my">

      <!-- ① 프로필: 이름 · 프로필 이미지 -->
      <!-- 로그인 전: 안내 + 로그인·가입 버튼(login.html). 로그인 후: 닉네임 + 어느 SNS 로 로그인했는지. my.js 가 auth.js 상태를 보고 고른다 -->
      <section class="profile" aria-labelledby="profile-name">
        <span class="profile__avatar" id="profile-avatar" aria-hidden="true"></span>
        <div class="profile__text">
          <h1 class="profile__name" id="profile-name" data-i18n="my.loginTitle">로그인이 필요해요</h1>
          <p class="profile__sub" id="profile-sub" data-i18n="my.loginSub">찜한 매장과 방문 기록을 저장해요</p>
        </div>
        <a class="profile__edit profile__login" id="profile-login" href="login.html?from=my.html" data-i18n="my.loginBtn">로그인 · 가입</a>
        <button type="button" class="profile__edit" id="profile-edit" data-i18n="profile.edit" hidden>프로필 수정</button>
      </section>

      <!-- ② 찜한 매장: 기기에 저장한 매장을 my.js 가 shops.js 데이터로 그린다. 하나도 없으면 한 줄 안내 -->
      <section class="saved" aria-labelledby="saved-title">
        <div class="my-head">
          <p class="eyebrow" id="saved-title"><span data-i18n="saved.title">찜한 매장</span> <span class="my-head__count" id="saved-count">0</span></p>
          <a class="my-head__link" href="saved.html" data-i18n="viewAll">전체 보기</a>
        </div>
        <div class="saved__scroll" id="saved-list" hidden></div>
        <p class="saved__empty" id="saved-empty" hidden><span data-i18n="saved.empty">아직 찜한 매장이 없어요.</span> <a href="search.html" data-i18n="tab.search">매장 검색</a></p>
      </section>

      <!-- ③ 방문 히스토리 -->
      <section class="history" aria-labelledby="history-title">
        <div class="my-head">
          <p class="eyebrow" id="history-title"><span data-i18n="history.title">방문 히스토리</span> <span class="my-head__count" id="history-count"></span></p>
          <a class="my-head__link" href="history.html" data-i18n="viewAll">전체 보기</a>
        </div>
        <ul class="my-card my-list" id="history-list"></ul>
      </section>

      <!-- ④ 언어 / 알림 설정 · 고객센터 -->
      <section class="settings" aria-labelledby="settings-title">
        <p class="eyebrow my-head" id="settings-title" data-i18n="settings">설정</p>
        <ul class="my-card my-list">
          <li>
            <a class="setting-row" id="lang-link" href="language.html">
              <span class="setting-row__label" data-i18n="settings.lang">언어</span>
              <span class="setting-row__value" id="lang-value">한국어</span>
              <img class="setting-row__chev" src="assets/chevron-right.svg" width="20" height="20" alt="">
            </a>
          </li>
          <li>
            <div class="setting-row">
              <span class="setting-row__label" id="noti-label" data-i18n="settings.noti">알림</span>
              <span class="setting-row__hint" data-i18n="settings.notiHint">새 에디터 픽 · 예약 안내</span>
              <button type="button" class="switch" role="switch" aria-checked="true" aria-labelledby="noti-label"><span class="switch__knob"></span></button>
            </div>
          </li>
          <li>
            <a class="setting-row" id="support-link" href="mailto:contact@theharper.co.kr">
              <span class="setting-row__label" data-i18n="settings.support">고객센터</span>
              <span class="setting-row__value">contact@theharper.co.kr</span>
              <img class="setting-row__chev" src="assets/chevron-right.svg" width="20" height="20" alt="">
            </a>
          </li>
        </ul>
      </section>

      <!-- ⑤ 로그아웃 -->
      <div class="logout" id="logout" hidden>
        <button type="button" class="logout__btn" id="logout-btn" data-i18n="logout">로그아웃</button>
      </div>

    </div>

    <!-- 프로필 수정 모달: 투어 안내 창(tour-info)과 같은 틀. 사진은 기기에서 골라 정사각형으로 줄여 저장하고, 닉네임을 고친다. 확인은 코코아 버튼(tour-info__cta) -->
    <div class="tour-info profile-modal" id="profile-modal" hidden>
      <div class="tour-info__dim" data-modal-close aria-hidden="true"></div>
      <div class="tour-info__card" role="dialog" aria-modal="true" aria-labelledby="profile-modal-title">
        <div class="tour-info__head">
          <h2 class="tour-info__title" id="profile-modal-title" data-i18n="profile.edit">프로필 수정</h2>
          <button type="button" class="tour-info__close" data-modal-close aria-label="닫기" data-i18n-attrs="aria-label=close">
            <img src="assets/close.svg" width="24" height="24" alt="">
          </button>
        </div>
        <div class="profile-modal__photo">
          <span class="profile__avatar profile-modal__avatar" id="profile-modal-avatar" aria-hidden="true"></span>
          <div class="profile-modal__photo-btns">
            <button type="button" class="profile-modal__btn" id="profile-photo-pick" data-i18n="profile.photoUpload">사진 올리기</button>
            <button type="button" class="profile-modal__btn profile-modal__btn--quiet" id="profile-photo-remove" data-i18n="profile.photoRemove" hidden>사진 지우기</button>
          </div>
          <input type="file" id="profile-photo-input" accept="image/*" hidden>
        </div>
        <div class="field">
          <label class="field__label" for="profile-name-input" data-i18n="signup.nickname">닉네임</label>
          <input class="field__input" id="profile-name-input" type="text" maxlength="20" autocomplete="nickname" autocapitalize="off">
        </div>
        <button type="button" class="tour-info__cta profile-modal__ok" id="profile-modal-ok" data-i18n="confirm">확인</button>
      </div>
    </div>

    <!-- 하단 탭 -->
    <nav class="tabbar" aria-label="주요 메뉴" data-i18n-attrs="aria-label=nav.main">
      <a class="tab" href="index.html">
        <span class="tab__icon tab__icon--home" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.home">홈</span>
      </a>
      <a class="tab" href="search.html">
        <span class="tab__icon tab__icon--search" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.search">매장 검색</span>
      </a>
      <a class="tab" href="my.html" aria-current="page">
        <span class="tab__icon tab__icon--user" aria-hidden="true"></span>
        <span class="tab__label" data-i18n="tab.my">내 정보</span>
      </a>
    </nav>
  </main>

  <script src="i18n.js?v=10"></script>
  <script src="auth.js?v=2"></script>
  <script src="config.js?v=2"></script>
  <script src="shops.js?v=8"></script>
  <script src="visits.js?v=1"></script>
  <script src="my.js?v=7"></script>
</body>
</html>
